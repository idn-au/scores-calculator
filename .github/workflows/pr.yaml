name: Run tests on PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install workspace
        run: pnpm install
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Validate scoring definitions
        run: uv run --project yaml-to-markdown python yaml-to-markdown/main.py validate
      - name: Test scoring review tooling
        run: uv run --project yaml-to-markdown python -m unittest discover -s yaml-to-markdown/tests
      - name: Check generated scoring documentation
        run: uv run --project yaml-to-markdown python yaml-to-markdown/main.py generate --check
      - name: Generate scoring impact report
        if: github.event_name == 'pull_request'
        run: |
          uv run --project yaml-to-markdown python yaml-to-markdown/main.py impact \
            --base-ref ${{ github.event.pull_request.base.sha }} \
            --output scoring-impact.md
          cat scoring-impact.md >> "$GITHUB_STEP_SUMMARY"
      - name: Type check JS library
        working-directory: js
        run: pnpm types
      - name: Build JS library
        working-directory: js
        run: pnpm build
      - name: Type check component library
        working-directory: score-component-lib
        run: pnpm types
      - name: Build component library
        working-directory: score-component-lib
        run: pnpm build
